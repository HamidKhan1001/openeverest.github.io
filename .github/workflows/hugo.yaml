
name: Build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Rebuild once a day to refresh the stargazers list baked into the site.
    # The GitHub /stargazers endpoint is restricted to admins/collaborators
    # since 2026-06-30, so we can no longer fetch it from client-side JS.
    - cron: '0 6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.3
      NODE_VERSION: 22.20.0
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Install Node.js dependencies
        run: npm ci
      - name: Fetch stargazers
        env:
          # Organization PAT (ROBOT_TOKEN) with `Metadata: Read` on
          # openeverest/openeverest — that's the only scope the /stargazers
          # endpoint requires. Since 2026-06-30 the endpoint no longer
          # accepts unauthenticated requests. If the secret is missing
          # (e.g. on a fork's PR build) we keep any pre-existing static JSON
          # so the page still renders — just with slightly stale data.
          STARGAZERS_TOKEN: ${{ secrets.ROBOT_TOKEN }}
        run: |
          if [ -z "${STARGAZERS_TOKEN}" ]; then
            echo "ROBOT_TOKEN is not set — skipping stargazers refresh."
            echo "The Stargazers page will fall back to the committed static/data/stargazers.json (if any)."
            exit 0
          fi
          ./hack/fetch_stargazers.sh
      - name: Build the site
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://openeverest.io/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
